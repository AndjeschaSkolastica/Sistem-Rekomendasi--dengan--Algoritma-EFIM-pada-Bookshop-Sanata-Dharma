<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Halaman User</title>

    <!-- ===================================== -->
    <!-- BOOTSTRAP -->
    <!-- ===================================== -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
      body {
        background: #f4f6f9;
      }

      /* ===================================== */
      /* NAVBAR */
      /* ===================================== */

      .navbar {
        padding: 15px 20px;
      }

      .navbar-brand {
        font-weight: bold;
        font-size: 22px;
      }

      /* ===================================== */
      /* LOGOUT */
      /* ===================================== */

      .btn-logout {
        background: #dc3545;

        color: white;

        border: none;

        padding: 10px 20px;

        border-radius: 8px;

        text-decoration: none;

        font-weight: bold;

        transition: 0.3s;
      }

      .btn-logout:hover {
        background: #bb2d3b;

        color: white;
      }

      /* ===================================== */
      /* CARD */
      /* ===================================== */

      .card {
        border: none;

        border-radius: 18px;

        overflow: hidden;
      }

      .card-header {
        padding: 20px;
      }

      .card-header h3 {
        margin: 0;

        font-weight: bold;
      }

      /* ===================================== */
      /* BUTTON */
      /* ===================================== */

      .btn-primary {
        padding: 12px 25px;

        font-weight: bold;
      }

      /* ===================================== */
      /* ALERT */
      /* ===================================== */

      .alert-info {
        border-radius: 12px;
      }

      /* ===================================== */
      /* RESPONSIVE */
      /* ===================================== */

      @media (max-width: 768px) {
        .navbar {
          flex-wrap: wrap;
        }

        .btn-logout {
          margin-top: 10px;
        }
      }
    </style>
  </head>

  <body>
    <!-- ===================================== -->
    <!-- NAVBAR -->
    <!-- ===================================== -->

    <nav class="navbar navbar-dark bg-primary">
      <div class="container-fluid d-flex justify-content-between align-items-center">
        <span class="navbar-brand"> Sanata Dharma University Press </span>

        <a href="/logout" class="btn-logout"> Logout </a>
      </div>
    </nav>

    <!-- ===================================== -->
    <!-- CONTAINER -->
    <!-- ===================================== -->

    <div class="container mt-5">
      <div class="card shadow">
        <!-- HEADER -->

        <div class="card-header bg-primary text-white">
          <h3>Cari Barang yang Mau Kamu Beli</h3>
        </div>

        <!-- BODY -->

        <div class="card-body">
          <!-- INFO -->

          <!-- FORM -->

          <form method="POST" action="/user/proses_rekomendasi">
            <!-- INPUT -->

            <div class="mb-3">
              <label class="form-label"> Masukkan Nama Barang </label>

              <input type="text" name="item" class="form-control" placeholder="Contoh : Kertas" required />
            </div>

            <!-- BUTTON -->

            <button type="submit" class="btn btn-primary">Cari Barang</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
